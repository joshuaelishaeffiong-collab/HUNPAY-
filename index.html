<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUNPAY</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#172033;
}

header{
  background:#172033;
  color:white;
  padding:20px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:720px;
  margin:auto;
  padding:15px;
}

.demo{
  background:#fff3cd;
  color:#664d03;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  text-align:center;
  font-weight:bold;
}

.balance{
  background:linear-gradient(135deg,#7419db,#a43aed);
  color:white;
  padding:25px;
  border-radius:22px;
  margin-bottom:18px;
}

.balance h1{
  font-size:38px;
  margin:10px 0;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:20px;
}

.menu{
  background:white;
  border-radius:16px;
  padding:16px 7px;
  text-align:center;
  box-shadow:0 4px 15px #0001;
  cursor:pointer;
  font-size:13px;
}

.icon{
  font-size:27px;
  margin-bottom:7px;
}

.card{
  background:white;
  border-radius:20px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 4px 18px #0001;
}

.hidden{
  display:none;
}

h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin:14px 0 7px;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:14px;
  border:0;
  border-radius:10px;
  background:#7920df;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.row{
  background:#f7f7fb;
  padding:13px;
  border-radius:10px;
  margin:9px 0;
}

.row strong{
  display:block;
  margin-bottom:5px;
}

.price{
  font-size:28px;
  font-weight:bold;
  margin:15px 0;
}

.success{
  display:none;
  background:#e8f8ee;
  color:#146c36;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:10px;
  border-bottom:1px solid #eee;
  text-align:left;
}

.whatsapp{
  background:#25D366;
}

@media(max-width:600px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .balance h1{
    font-size:32px;
  }

  .card{
    padding:17px;
  }

}
</style>
</head>

<body>

<header>
HUNPAY
</header>

<div class="container">

<div class="demo">
DEMO / TEST MODE — No real payments are processed.
</div>


<!-- DASHBOARD -->

<div class="balance">

<small>Wallet Balance</small>

<h1>₦0.00</h1>

<small>Demo trading wallet</small>

</div>


<!-- MENU -->

<div class="icon">💰</div>
Wallet
</div>

<div class="menu" onclick="show('idcode')">
<div class="icon">🪪</div>
ID Code
</div>
